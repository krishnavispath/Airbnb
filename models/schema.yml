models:
  - name: dim_listings_cleansed
    columns:
      - name: listing_id
        data_tests:
          - not_null
          - unique
      
      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - not_null
          - accepted_values:
              name: dim_listings_cleansed_room_type_accepted_values
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

  - name: dim_hosts_cleansed
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        data_type: integer
      - name: host_name
        data_type: string
      - name: is_superhost
        data_type: boolean
      - name: host_created_at
        data_type: timestamp
      - name: host_updated_at
        data_type: timestamp