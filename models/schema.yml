models:
  - name: dim_listings_cleansed
    description: "This table contains cleansed listings data with enforced contract"
    data_tests:
      - minimum_row_count:
          name: dim_listings_cleansed_minimum_row_count
          arguments:
            min_rows: 20000

    columns:
      - name: listing_id
        description: "This column is the Unique identifier for each listing"
        data_tests:
          - not_null
          - unique
      
      - name: host_id
        description: "This column is the foreign key that references the dim_hosts_cleansed table"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "This column indicates the type of room available for booking"
        data_tests:
          - not_null
          - accepted_values:
              name: dim_listings_cleansed_room_type_accepted_values
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: "This column indicates the minimum number of nights a guest can stay"
        data_tests:
          - check_negative_values:
              name: dim_listings_cleansed_minimum_nights_check_negative_values

  - name: dim_hosts_cleansed
    description: "This table contains cleansed host data with enforced contract"
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        data_type: integer
        description: "This column is the Unique identifier for each host"
        data_tests:
          - check_negative_values:
              name: dim_hosts_cleansed_host_id_check_negative_values

      - name: host_name
        data_type: string
        description: "This column contains the name of the host"
      - name: is_superhost
        data_type: boolean
        description: "This column indicates whether the host is a superhost"
      - name: host_created_at
        data_type: timestamp
        description: "This column contains the timestamp when the host was created"
      - name: host_updated_at
        data_type: timestamp
        description: "This column contains the timestamp when the host was last updated"

  - name: dim_listings_w_hosts
    description: "This table contains listings data with host information"
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          name: dim_listings_w_hosts_row_count_to_equal_other_table
          arguments:
            compare_model: source('airbnb', 'listings')

    columns:
      - name: price
        description: "This column indicates the price of the listing"
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: dim_listings_w_hosts_price_expect_column_values_to_be_between
              arguments:
                min_value: 0
                max_value: 5000
              config:
                severity: warn
        